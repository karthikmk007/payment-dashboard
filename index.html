<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="dashboard">
    <h1>Payment Dashboard</h1>
    <div class="summary">
      <div class="card">
        <h2>Total Revenue</h2>
        <p id="revenue">$0</p>
      </div>
      <div class="card">
        <h2>Total Payments</h2>
        <p id="payments">0</p>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Customer</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Filled by JavaScript -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
